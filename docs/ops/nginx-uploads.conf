/**
 * Nginx location block for Celeventic local uploads.
 *
 * DO NOT blindly overwrite /etc/nginx/sites-enabled/celeventic.
 * Paste this `location` into the active HTTPS server block, then:
 *
 *   sudo nginx -t && sudo systemctl reload nginx
 *
 * Validate:
 *   curl -I https://www.celeventic.com/uploads/<path>.mp4
 *   curl -H "Range: bytes=0-1023" -I https://www.celeventic.com/uploads/<path>.mp4
 *
 * Expected: HTTP 200/206, Accept-Ranges: bytes, Content-Type: video/mp4
 */

