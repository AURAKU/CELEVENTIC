name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: "file:./prisma/ci.db"
      NEXTAUTH_SECRET: "ci-placeholder-not-a-real-secret"
      NEXTAUTH_URL: "http://localhost:3000"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:gifts
      - run: npm run test:integrity
      - run: npm run test:admission
      - run: npm run test:accept-sqlite
      - run: npm run build
        env:
          NEXT_DIST_DIR: .next-verify
